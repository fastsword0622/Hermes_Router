[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-router"
version = "0.1.0"
description = "Local Hermes development router with approved specifications, isolated worktrees and verified provider escalation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
hermes-router = "hermes_router.__main__:main"
dev-router = "hermes_router.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["hermes_router"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
